<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Your Account</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .account-wrap { max-width: 900px; margin: 24px auto; padding: 16px; }
    .card { background: rgba(0,0,0,0.35); color: white; padding: 16px; border-radius: 14px; margin-bottom: 14px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .muted { opacity: 0.8; font-size: 13px; }
    .btn { padding: 10px 12px; border-radius: 10px; border: 0; cursor:pointer; font-weight:700; }
    .btn-primary { background:#2b63ff; color:white; }
    .btn-ghost { background: rgba(255,255,255,0.12); color:white; }
    ul { list-style:none; padding:0; margin:0; }
    li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background: rgba(255,255,255,0.12); font-size:12px; }
  </style>
</head>
<body>
  <div class="account-wrap">
    <div class="card">
      <div class="row">
        <div>
          <div style="font-size:22px; font-weight:800;">Account</div>
          <div class="muted" id="account-email"></div>
        </div>
        <div class="row">
          <button class="btn btn-ghost" id="back-btn">Back to map</button>
          <button class="btn btn-primary" id="signout-btn">Sign out</button>
        </div>
      </div>

      <div style="margin-top:12px;">
        <div style="font-weight:800;">Username</div>
        <div id="account-username" style="font-size:18px;">Loading…</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div style="font-size:18px; font-weight:800;">Your feedback</div>
          <div class="muted" id="feedback-count"></div>
        </div>
      </div>
      <div id="account-error" class="muted" style="margin-top:12px; color:#ffb3b3;"></div>
      <ul id="feedback-list"></ul>
    </div>
  </div>

  <script type="module" src="js/account.js"></script>
</body>
</html>
